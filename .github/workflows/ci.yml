name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Sync environment
        run: uv sync
      - name: Run tests
        run: uv run pytest -q tests
      - name: Compile Python sources
        run: uv run python -m compileall -q insight scripts
