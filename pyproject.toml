[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight"
version = "0.1.0"
description = "INSIGHT: Inference-time Sequence Introspection for VLA Help Triggers"
authors = [{ name = "Ulas Berk Karli" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "scikit-learn",
  "matplotlib",
  "tqdm",
  "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["insight*"]

[dependency-groups]
dev = [
  "pytest>=8,<10"
]
